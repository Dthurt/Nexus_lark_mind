name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pytest
        env:
          PYTHONPATH: .
          REDIS_URL: memory://local
          DATABASE_URL: sqlite+aiosqlite:///data/test_ci.db
        run: |
          mkdir -p data logs
          pytest -q --tb=short

      - name: nlm boot console smoke
        if: matrix.python-version == '3.11'
        env:
          PYTHONPATH: .
          PYTHONUTF8: "1"
        run: |
          python -m py_compile scripts/nlm_boot.py
          python scripts/nlm_boot.py --help
          pytest -q --tb=short -o addopts= -m nlm_boot tests/test_nlm_boot_smoke.py

      - name: Perf smoke (compaction budget)
        if: matrix.python-version == '3.11'
        env:
          PYTHONPATH: .
          REDIS_URL: memory://local
        run: |
          pytest -q --tb=short tests/test_perf_smoke.py

  build-web:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci, test, build
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

      - name: Upload web-static artifact
        if: matrix.node-version == '22'
        uses: actions/upload-artifact@v4
        with:
          name: web-static
          path: web-static
          retention-days: 7

  e2e-web:
    name: Playwright e2e
    runs-on: ubuntu-latest
    needs: [build-web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Download web-static
        uses: actions/download-artifact@v4
        with:
          name: web-static
          path: web-static

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright
        working-directory: web
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Start demo stack
        env:
          PYTHONPATH: .
          PYTHONUTF8: "1"
          REDIS_URL: memory://local
          DATABASE_URL: sqlite+aiosqlite:///data/test_e2e.db
          KERNEL_RPC_URL: http://127.0.0.1:8001
          ORCHESTRATOR_RPC_URL: http://127.0.0.1:8002
          WEB_STATIC_DIR: web-static
        run: |
          mkdir -p data logs
          python -m src.entry_local > logs/e2e-stack.log 2>&1 &
          echo $! > logs/e2e-stack.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health >/dev/null && curl -sf http://127.0.0.1:8001/health >/dev/null; then
              echo "stack ready"
              exit 0
            fi
            sleep 2
          done
          echo "stack failed to boot" >&2
          tail -n 200 logs/e2e-stack.log || true
          exit 1

      - name: Playwright
        working-directory: web
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
          CI: "true"
        run: npm run test:e2e

      - name: Stack logs on failure
        if: failure()
        run: tail -n 200 logs/e2e-stack.log || true

  compose-config:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker compose files
        run: |
          cp -n .env.example .env
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.crawl.yml config >/dev/null
