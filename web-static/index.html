<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nexus-Lark-Mind</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="atmosphere"></div>
  <main class="shell">
    <header class="brand">
      <div class="logo">Nexus-Lark-Mind</div>
      <p class="tagline">个人 AI Agent 编排平台 · Web 流式对话</p>
    </header>

    <section class="chat-panel" aria-label="对话">
      <div id="messages" class="messages"></div>
      <form id="chat-form" class="composer">
        <textarea id="input" rows="2" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
        <button type="submit" id="send">发送</button>
      </form>
      <div class="meta">
        <span>Session: <code id="session-id"></code></span>
        <span id="status">ready</span>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
