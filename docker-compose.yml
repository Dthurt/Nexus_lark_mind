# Nexus-Lark-Mind — production-ish stack (one image, three app services + Redis)
#
#   cp .env.example .env
#   docker compose up --build -d
#
# Crawl4AI image:
#   docker compose -f docker-compose.yml -f docker-compose.crawl.yml up --build -d

name: nexus-lark-mind

x-nlm-common: &nlm-common
  image: nexus-lark-mind:latest
  restart: unless-stopped
  env_file:
    - .env
  networks:
    - nlm
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "3"

services:
  redis:
    image: redis:7-alpine
    container_name: nlm-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nlm
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  core-kernel:
    <<: *nlm-common
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENABLE_CRAWL: "0"
    container_name: nlm-core-kernel
    command: ["python", "-m", "src.entry_kernel"]
    environment:
      HEALTH_PORT: "8001"
      KERNEL_HOST: "0.0.0.0"
      KERNEL_PORT: "8001"
      DATABASE_URL: "sqlite+aiosqlite:///data/nexus.db"
      REDIS_URL: "redis://redis:6379/0"
      KERNEL_RPC_URL: "http://core-kernel:8001"
      ORCHESTRATOR_RPC_URL: "http://orchestrator:8002"
      PLUGINS_DIR: "/app/plugins_volume"
      WEB_STATIC_DIR: "/app/web-static"
      # Host projects mounted at /workspaces (see README «挂载本地代码目录»)
      NLM_WORKSPACE_ROOT: "/workspaces"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    volumes:
      - ./data:/app/data
      - ./plugins_volume:/app/plugins_volume
      - ./logs:/app/logs
      # Map a host folder into the container so Agent 工具能读写本地项目。
      # Override with NLM_HOST_WORKSPACE in .env (Windows example: E:/code or //c/Users/you/code).
      - ${NLM_HOST_WORKSPACE:-./workspaces}:/workspaces:rw
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  orchestrator:
    <<: *nlm-common
    container_name: nlm-orchestrator
    command: ["python", "-m", "src.entry_orchestrator"]
    environment:
      HEALTH_PORT: "8002"
      ORCHESTRATOR_HOST: "0.0.0.0"
      ORCHESTRATOR_PORT: "8002"
      KERNEL_RPC_URL: "http://core-kernel:8001"
      ORCHESTRATOR_RPC_URL: "http://orchestrator:8002"
      REDIS_URL: "redis://redis:6379/0"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    volumes:
      - ./logs:/app/logs
    ports:
      - "8002:8002"
    depends_on:
      redis:
        condition: service_healthy
      core-kernel:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8002/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  adapters:
    <<: *nlm-common
    container_name: nlm-adapters
    command: ["python", "-m", "src.entry_adapters"]
    environment:
      HEALTH_PORT: "8000"
      ADAPTERS_HOST: "0.0.0.0"
      ADAPTERS_PORT: "8000"
      ORCHESTRATOR_RPC_URL: "http://orchestrator:8002"
      KERNEL_RPC_URL: "http://core-kernel:8001"
      REDIS_URL: "redis://redis:6379/0"
      WEB_STATIC_DIR: "/app/web-static"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    volumes:
      - ./web-static:/app/web-static
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
      core-kernel:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

networks:
  nlm:
    name: nlm-net
    driver: bridge

volumes:
  redis_data:
    name: nlm-redis-data
